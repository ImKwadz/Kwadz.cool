<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImKwadz | Fun</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      background: #1e293b;
    }

    .topbar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: bold;
    }

    nav a {
      color: #67e8f9;
      text-decoration: none;
      margin-left: 14px;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px 70px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 1.1rem;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .game-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .game-card {
      background: #1e293b;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(103, 232, 249, 0.4);
    }

    .game-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .game-card p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 0;
    }

    .tag {
      display: inline-block;
      background: rgba(34, 211, 238, 0.18);
      color: #67e8f9;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .tag.soon {
      background: rgba(167, 139, 250, 0.18);
      color: #c4b5fd;
    }

    .soon-card {
      opacity: 0.9;
    }

    footer {
      padding: 20px;
      background: #1e293b;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">ImKwadz</div>
      <nav>
        <a href="/home/">Home</a>
        <a href="/fun/">Fun</a>
        <a href="/about/">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Fun</h1>
      <p>Choose a game.</p>
    </section>

    <section class="games-grid">
      <a class="game-link" href="/fun/cookieclicker/">
        <article class="game-card">
          <div class="tag">Playable now</div>
          <h2>Cookie Clicker</h2>
          <p>Click cookies, buy upgrades, and grow your cookie empire.</p>
        </article>
      </a>

      <article class="game-card soon-card">
        <div class="tag soon">Coming soon</div>
        <h2>Reaction Game</h2>
        <p>A fast timing game you can add later.</p>
      </article>

      <article class="game-card soon-card">
        <div class="tag soon">Coming soon</div>
        <h2>Memory Match</h2>
        <p>Flip cards and match pairs.</p>
      </article>
    </section>
  </main>

  <footer>
    © 2026 ImKwadz
  </footer>
</body>
</html>
