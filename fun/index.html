<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kwadz.fun</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1020;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
  }
  body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%,rgba(110,168,255,.25),transparent 25%),
      radial-gradient(circle at 80% 10%,rgba(255,209,102,.18),transparent 22%),
      radial-gradient(circle at 50% 80%,rgba(255,107,107,.14),transparent 28%);
    pointer-events:none;
  }
  .wrap{
    position:relative;
    max-width:1100px;
    margin:0 auto;
    padding:45px 18px;
  }
  header{
    text-align:center;
    margin-bottom:38px;
  }
  h1{
    font-size:clamp(2.3rem,7vw,5rem);
    margin:0;
    letter-spacing:-2px;
  }
  .sub{
    color:#b9c3ff;
    font-size:1.1rem;
    margin-top:10px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
  }
  .card{
    display:block;
    text-decoration:none;
    color:white;
    border:2px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);
    border-radius:24px;
    padding:24px;
    min-height:210px;
    box-shadow:0 18px 45px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
    transition:.18s transform,.18s border-color,.18s background;
  }
  .card:hover{
    transform:translateY(-7px) scale(1.015);
    border-color:#ffd166;
    background:rgba(255,255,255,.13);
  }
  .emoji{
    font-size:3rem;
    margin-bottom:14px;
  }
  h2{
    margin:0 0 10px;
    font-size:1.5rem;
  }
  p{
    margin:0;
    color:#d6dcff;
    line-height:1.45;
  }
  .tag{
    display:inline-block;
    margin-top:18px;
    font-size:.8rem;
    color:#10131f;
    background:#ffd166;
    padding:6px 10px;
    border-radius:999px;
    font-weight:bold;
  }
  .back{
    display:inline-block;
    margin-top:32px;
    color:#b9c3ff;
    text-decoration:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kwadz.fun</h1>
    <div class="sub">interactive weird stuff, not boring filler</div>
  </header>

  <div class="grid">
    <a class="card" href="./cookieclicker/">
      <div class="emoji">🍪</div>
      <h2>Cookie Bakery</h2>
      <p>A huge cookie incremental thing with buildings, upgrades, minigames, and too many numbers.</p>
      <span class="tag">clicker</span>
    </a>

    <a class="card" href="./timemachine/">
      <div class="emoji">🕰️</div>
      <h2>Time Machine</h2>
      <p>Enter a year and get blasted somewhere between the Big Bang and Kwadz.fun existing.</p>
      <span class="tag">experiment</span>
    </a>
  </div>

  <a class="back" href="../home/">← back home</a>
</div>
</body>
</html>
