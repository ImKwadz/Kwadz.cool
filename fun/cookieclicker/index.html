<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImKwadz | Cookie Clicker</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #1e293b;
    }

    .topbar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: bold;
    }

    nav a {
      color: #67e8f9;
      text-decoration: none;
      margin-left: 14px;
      font-weight: bold;
    }

    main {
      max-width: 950px;
      margin: 0 auto;
      padding: 50px 20px 70px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #a78bfa;
      text-decoration: none;
      font-weight: bold;
    }

    .cookie {
      font-size: 6rem;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      margin: 15px 0;
      transition: transform 0.08s ease;
    }

    .cookie:active {
      transform: scale(0.92);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin: 30px 0;
    }

    .stat-box {
      background: #1e293b;
      border-radius: 16px;
      padding: 18px;
    }

    .stat-label {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .shop {
      margin-top: 20px;
      background: #1e293b;
      border-radius: 18px;
      padding: 24px;
    }

    .shop h2 {
      margin-top: 0;
    }

    .shop-item {
      background: #334155;
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
    }

    .shop-item strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .shop-item span {
      display: block;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #22d3ee;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      margin: 6px;
    }

    button:hover {
      background: #67e8f9;
    }

    .secondary {
      background: #a78bfa;
      color: white;
    }

    .secondary:hover {
      background: #c4b5fd;
    }

    .message {
      min-height: 26px;
      margin-top: 18px;
      color: #facc15;
      font-weight: bold;
    }

    footer {
      padding: 20px;
      background: #1e293b;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">ImKwadz</div>
      <nav>
        <a href="/home/">Home</a>
        <a href="/fun/">Fun</a>
        <a href="/about/">About</a>
      </nav>
    </div>
  </header>

  <main>
    <a class="back-link" href="/fun/">← Back to Game Select</a>

    <h1>Cookie Clicker</h1>
    <p>Click the cookie. Buy upgrades. Save your progress.</p>

    <div class="cookie" onclick="clickCookie()">🍪</div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Cookies</div>
        <div class="stat-value" id="cookies">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Per Click</div>
        <div class="stat-value" id="perClick">1</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Per Second</div>
        <div class="stat-value" id="perSecond">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Lifetime Cookies</div>
        <div class="stat-value" id="lifetimeCookies">0</div>
      </div>
    </div>

    <div>
      <button onclick="saveGame()">Save Game</button>
      <button class="secondary" onclick="resetGame()">Reset</button>
    </div>

    <div class="message" id="message"></div>

    <section class="shop">
      <h2>Shop</h2>

      <div class="shop-item">
        <strong>Stronger Click</strong>
        <span>+1 per click</span>
        <button onclick="buyUpgrade('click')">
          Buy for <span id="clickCost">25</span>
        </button>
      </div>

      <div class="shop-item">
        <strong>Auto Clicker</strong>
        <span>+1 cookie per second</span>
        <button onclick="buyUpgrade('auto')">
          Buy for <span id="autoCost">50</span>
        </button>
      </div>

      <div class="shop-item">
        <strong>Bakery</strong>
        <span>+5 cookies per second</span>
        <button onclick="buyUpgrade('bakery')">
          Buy for <span id="bakeryCost">200</span>
        </button>
      </div>
    </section>
  </main>

  <footer>
    © 2026 ImKwadz
  </footer>

  <script>
    const SAVE_KEY = "imkwadz_cookie_clicker_v1";

    let state = {
      cookies: 0,
      perClick: 1,
      perSecond: 0,
      lifetimeCookies: 0,
      costs: {
        click: 25,
        auto: 50,
        bakery: 200
      }
    };

    function updateDisplay() {
      document.getElementById("cookies").textContent = Math.floor(state.cookies);
      document.getElementById("perClick").textContent = state.perClick;
      document.getElementById("perSecond").textContent = state.perSecond;
      document.getElementById("lifetimeCookies").textContent = Math.floor(state.lifetimeCookies);

      document.getElementById("clickCost").textContent = state.costs.click;
      document.getElementById("autoCost").textContent = state.costs.auto;
      document.getElementById("bakeryCost").textContent = state.costs.bakery;
    }

    function setMessage(text) {
      document.getElementById("message").textContent = text;
    }

    function earn(amount) {
      state.cookies += amount;
      state.lifetimeCookies += amount;
      updateDisplay();
    }

    function clickCookie() {
      earn(state.perClick);
      setMessage("Cookie clicked.");
    }

    function buyUpgrade(type) {
      const cost = state.costs[type];

      if (state.cookies < cost) {
        setMessage("Not enough cookies.");
        return;
      }

      state.cookies -= cost;

      if (type === "click") {
        state.perClick += 1;
        state.costs.click = Math.floor(state.costs.click * 1.8);
        setMessage("Per click upgraded.");
      }

      if (type === "auto") {
        state.perSecond += 1;
        state.costs.auto = Math.floor(state.costs.auto * 1.9);
        setMessage("Auto clicker bought.");
      }

      if (type === "bakery") {
        state.perSecond += 5;
        state.costs.bakery = Math.floor(state.costs.bakery * 2);
        setMessage("Bakery bought.");
      }

      updateDisplay();
    }

    function saveGame() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      setMessage("Game saved.");
    }

    function loadGame() {
      const saved = localStorage.getItem(SAVE_KEY);
      if (!saved) {
        updateDisplay();
        return;
      }

      try {
        const parsed = JSON.parse(saved);
        if (parsed) {
          state = parsed;
        }
      } catch (e) {
        console.log("Could not load save.");
      }

      updateDisplay();
      setMessage("Save loaded.");
    }

    function resetGame() {
      if (!confirm("Reset your cookie game?")) return;

      state = {
        cookies: 0,
        perClick: 1,
        perSecond: 0,
        lifetimeCookies: 0,
        costs: {
          click: 25,
          auto: 50,
          bakery: 200
        }
      };

      localStorage.removeItem(SAVE_KEY);
      updateDisplay();
      setMessage("Game reset.");
    }

    setInterval(() => {
      if (state.perSecond > 0) {
        earn(state.perSecond);
      }
    }, 1000);

    loadGame();
  </script>
</body>
</html>
