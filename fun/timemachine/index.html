<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ImKwadz | Time Machine</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #030712;
  color: white;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(circle at 12% 12%, rgba(103, 232, 249, 0.18), transparent 28%),
    radial-gradient(circle at 82% 18%, rgba(250, 204, 21, 0.14), transparent 25%),
    radial-gradient(circle at 50% 90%, rgba(244, 114, 182, 0.10), transparent 32%),
    linear-gradient(135deg, #020617, #0f172a 46%, #111827);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.2;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 2px),
    radial-gradient(circle, rgba(103,232,249,.55) 1px, transparent 2px);
  background-size: 80px 80px, 145px 145px;
  background-position: 0 0, 45px 60px;
  animation: stars 55s linear infinite;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .3;
  background:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 70px 70px;
  mask-image: radial-gradient(circle at center, black, transparent 78%);
}

@keyframes stars {
  from { background-position: 0 0, 45px 60px; }
  to { background-position: -700px 0, -460px 60px; }
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, rgba(15, 23, 42, .98), rgba(2, 6, 23, .95));
  border-bottom: 1px solid rgba(103,232,249,.22);
  box-shadow: 0 10px 35px rgba(0,0,0,.42);
  backdrop-filter: blur(12px);
}

.topbar {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.brand {
  font-size: 1.25rem;
  font-weight: 900;
}

nav a {
  color: #67e8f9;
  text-decoration: none;
  margin-left: 14px;
  font-weight: bold;
}

.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px 18px;
  text-align: center;
  position: relative;
  z-index: 3;
}

.hero h1 {
  margin: 0;
  font-size: clamp(3rem, 9vw, 7rem);
  letter-spacing: -4px;
  text-shadow:
    0 0 22px rgba(103,232,249,.5),
    0 9px 0 rgba(0,0,0,.3);
}

.hero p {
  margin: 12px auto 0;
  max-width: 720px;
  color: #cbd5e1;
  font-size: 1.08rem;
  line-height: 1.6;
}

.machine-body {
  max-width: 1260px;
  margin: 0 auto 70px;
  padding: 18px;
  position: relative;
  z-index: 4;
}

.machine-frame {
  position: relative;
  border-radius: 38px;
  padding: 24px;
  background:
    linear-gradient(145deg, #475569, #0f172a 24%, #020617 65%, #334155);
  border: 5px solid #64748b;
  box-shadow:
    0 36px 90px rgba(0,0,0,.62),
    inset 0 0 0 3px rgba(255,255,255,.08),
    inset 0 0 80px rgba(103,232,249,.08);
  overflow: hidden;
}

.machine-frame::before {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: 28px;
  border: 2px dashed rgba(148,163,184,.38);
  pointer-events: none;
}

.machine-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(90deg, transparent 0 34px, rgba(255,255,255,.035) 34px 35px),
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(255,255,255,.025) 34px 35px);
  opacity: .45;
}

.rivets {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 8;
}

.rivets span {
  position: absolute;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 35%, #f8fafc, #64748b 55%, #1e293b);
  box-shadow:
    inset -2px -2px 4px rgba(0,0,0,.5),
    0 0 8px rgba(255,255,255,.18);
}

.r1 { left: 20px; top: 20px; }
.r2 { right: 20px; top: 20px; }
.r3 { left: 20px; bottom: 20px; }
.r4 { right: 20px; bottom: 20px; }
.r5 { left: 50%; top: 20px; }
.r6 { left: 50%; bottom: 20px; }
.r7 { left: 20px; top: 50%; }
.r8 { right: 20px; top: 50%; }

.pipe {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  border-radius: 999px;
  background:
    linear-gradient(90deg,#111827,#94a3b8 20%,#334155 55%,#94a3b8 80%,#111827);
  box-shadow:
    inset 0 3px 6px rgba(255,255,255,.18),
    inset 0 -4px 8px rgba(0,0,0,.58),
    0 0 18px rgba(103,232,249,.13);
}

.pipe.top {
  height: 18px;
  left: 95px;
  right: 95px;
  top: 40px;
}

.pipe.bottom {
  height: 20px;
  left: 105px;
  right: 105px;
  bottom: 48px;
}

.pipe.left,
.pipe.right {
  width: 18px;
  top: 96px;
  bottom: 96px;
  background:
    linear-gradient(180deg,#111827,#94a3b8 20%,#334155 55%,#94a3b8 80%,#111827);
}

.pipe.left { left: 44px; }
.pipe.right { right: 44px; }

.gear {
  position: absolute;
  z-index: 2;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  background:
    repeating-conic-gradient(#94a3b8 0 12deg, #334155 12deg 24deg);
  box-shadow:
    0 0 0 8px #0f172a,
    0 0 0 12px #64748b,
    0 12px 35px rgba(0,0,0,.48);
  animation: spin 12s linear infinite;
  opacity: .75;
}

.gear::before {
  content: "";
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  background: #020617;
  box-shadow: inset 0 0 18px rgba(103,232,249,.24);
}

.gear::after {
  content: "";
  position: absolute;
  inset: 35px;
  border-radius: 50%;
  background: #67e8f9;
  box-shadow: 0 0 18px #67e8f9;
}

.gear.g1 { left: 46px; bottom: 42px; }
.gear.g2 { right: 46px; top: 54px; animation-direction: reverse; }
.gear.g3 { right: 154px; bottom: 38px; width: 58px; height: 58px; animation-duration: 7s; }

@keyframes spin {
  from { transform: rotate(0); }
  to { transform: rotate(360deg); }
}

.warning {
  position: absolute;
  z-index: 9;
  background: #facc15;
  color: #111827;
  font-weight: 900;
  font-size: .72rem;
  letter-spacing: .8px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 2px solid #111827;
  box-shadow: 0 6px 0 rgba(0,0,0,.38);
  transform: rotate(-4deg);
}

.warning.w1 { left: 82px; top: 70px; }
.warning.w2 { right: 100px; bottom: 82px; transform: rotate(5deg); }

.gauge {
  position: absolute;
  z-index: 9;
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, #020617 0 48%, #94a3b8 49% 61%, #1e293b 62%);
  border: 3px solid #64748b;
  box-shadow: 0 10px 25px rgba(0,0,0,.42);
}

.gauge::before {
  content: "";
  position: absolute;
  width: 4px;
  height: 28px;
  background: #facc15;
  left: 50%;
  top: 18px;
  transform-origin: bottom center;
  transform: translateX(-50%) rotate(35deg);
  border-radius: 999px;
}

.gauge::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #facc15;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
}

.gauge.a { left: 90px; bottom: 82px; }
.gauge.b { right: 94px; top: 108px; }

.teleporter {
  position: relative;
  z-index: 10;
  margin: 24px 60px 30px;
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(8,13,31,.98), rgba(30,41,59,.98)),
    radial-gradient(circle at top left, rgba(103,232,249,.22), transparent 35%);
  border: 2px solid rgba(103,232,249,.38);
  border-radius: 28px;
  padding: 18px;
  box-shadow:
    0 24px 60px rgba(0,0,0,.48),
    inset 0 0 0 1px rgba(255,255,255,.06),
    inset 0 0 44px rgba(103,232,249,.09);
}

.teleporter::before {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  right: -95px;
  top: -120px;
  background:
    radial-gradient(circle, rgba(103,232,249,.36), transparent 62%);
  animation: pulseCore 2.2s ease-in-out infinite alternate;
}

.teleporter::after {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 22px;
  border: 1px dashed rgba(103,232,249,.22);
  pointer-events: none;
}

@keyframes pulseCore {
  from { transform: scale(.9); opacity: .55; }
  to { transform: scale(1.08); opacity: 1; }
}

.teleporter-title {
  position: relative;
  z-index: 2;
  margin: 0 0 12px;
  color: #67e8f9;
  font-weight: 900;
  letter-spacing: 1px;
}

.teleporter-row {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 10px;
}

input {
  width: 100%;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 14px;
  padding: 14px 16px;
  background: #020617;
  color: white;
  font-size: 1rem;
  outline: none;
  box-shadow: inset 0 0 18px rgba(103,232,249,.09);
}

input:focus {
  border-color: #67e8f9;
  box-shadow:
    0 0 0 3px rgba(103,232,249,.18),
    inset 0 0 18px rgba(103,232,249,.13);
}

button {
  border: 0;
  border-radius: 14px;
  padding: 14px 16px;
  font-weight: 900;
  cursor: pointer;
  background: linear-gradient(#a5f3fc,#22d3ee);
  color: #082f49;
  box-shadow: 0 5px 0 #0e7490;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #0e7490;
}

.quick-jumps {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.quick-jumps button {
  background: rgba(103,232,249,.12);
  color: #a5f3fc;
  border: 1px solid rgba(103,232,249,.25);
  box-shadow: none;
  border-radius: 999px;
  padding: 8px 11px;
  font-size: .85rem;
}

.message {
  position: relative;
  z-index: 2;
  min-height: 22px;
  margin-top: 12px;
  color: #fde68a;
  font-size: .95rem;
}

.timeline-window {
  position: relative;
  z-index: 8;
  margin: 0 40px 30px;
  border-radius: 32px;
  background:
    linear-gradient(180deg,#020617,#0f172a);
  border: 3px solid #64748b;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.06),
    inset 0 0 65px rgba(103,232,249,.09),
    0 22px 65px rgba(0,0,0,.46);
  overflow: hidden;
}

.timeline-window::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 42px;
  background:
    linear-gradient(180deg, rgba(148,163,184,.32), transparent),
    repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 28px);
  z-index: 9;
  pointer-events: none;
}

.timeline-window::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(2,6,23,.86), transparent 10%, transparent 90%, rgba(2,6,23,.86));
  z-index: 9;
  pointer-events: none;
}

.timeline-label {
  color: #cbd5e1;
  font-weight: bold;
  padding: 14px 22px 0;
  position: relative;
  z-index: 10;
}

.timeline-track {
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 38px 46px 68px;
  scroll-snap-type: x mandatory;
  scrollbar-color: #67e8f9 #0f172a;
  scrollbar-width: thin;
}

.timeline-track::-webkit-scrollbar { height: 14px; }

.timeline-track::-webkit-scrollbar-track {
  background: #0f172a;
  border-radius: 999px;
}

.timeline-track::-webkit-scrollbar-thumb {
  background: linear-gradient(90deg,#67e8f9,#a78bfa,#facc15,#fb7185);
  border-radius: 999px;
}

.timeline-line {
  position: absolute;
  left: 46px;
  right: 46px;
  top: 286px;
  height: 12px;
  border-radius: 999px;
  background:
    linear-gradient(90deg,#67e8f9,#a78bfa,#facc15,#fb7185);
  box-shadow:
    0 0 28px rgba(103,232,249,.48),
    0 0 70px rgba(250,204,21,.2);
}

.timeline-line::before,
.timeline-line::after {
  content: "";
  position: absolute;
  inset: -13px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.12);
}

.timeline-scan {
  position: absolute;
  top: 42px;
  bottom: 0;
  width: 130px;
  left: 0;
  z-index: 4;
  background: linear-gradient(90deg, transparent, rgba(103,232,249,.16), transparent);
  animation: scan 5s linear infinite;
  pointer-events: none;
}

@keyframes scan {
  from { transform: translateX(-170px); }
  to { transform: translateX(1450px); }
}

.events-row {
  display: flex;
  gap: 26px;
  width: max-content;
  position: relative;
  z-index: 5;
}

.event {
  width: 350px;
  min-height: 555px;
  scroll-snap-align: center;
  position: relative;
  padding: 18px;
  border-radius: 34px;
  background:
    linear-gradient(145deg, rgba(51,65,85,.98), rgba(15,23,42,.98) 45%, rgba(2,6,23,.98)),
    radial-gradient(circle at top left, rgba(103,232,249,.18), transparent 35%);
  border: 3px solid #64748b;
  box-shadow:
    0 30px 75px rgba(0,0,0,.58),
    inset 0 0 0 2px rgba(255,255,255,.08),
    inset 0 0 48px rgba(103,232,249,.09);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

.event:hover {
  transform: translateY(-10px) scale(1.015);
  border-color: #67e8f9;
  box-shadow:
    0 36px 85px rgba(0,0,0,.64),
    0 0 0 3px rgba(103,232,249,.18),
    inset 0 0 54px rgba(103,232,249,.14);
}

.event.highlight {
  animation: cardWarp 1.2s ease;
  border-color: #facc15;
  box-shadow:
    0 0 0 5px rgba(250,204,21,.25),
    0 36px 92px rgba(0,0,0,.68),
    inset 0 0 58px rgba(250,204,21,.14);
}

@keyframes cardWarp {
  0% { transform: scale(1.06) rotate(-1deg); }
  45% { transform: scale(1.02) rotate(1deg); }
  100% { transform: scale(1) rotate(0); }
}

.event::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 26px;
  border: 1px solid rgba(255,255,255,.08);
  pointer-events: none;
}

.event::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 34px;
  background:
    linear-gradient(120deg, rgba(255,255,255,.12), transparent 22%, transparent 70%, rgba(255,255,255,.05));
  pointer-events: none;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  position: relative;
  z-index: 2;
}

.year {
  background: #020617;
  color: #67e8f9;
  border: 2px solid rgba(103,232,249,.45);
  border-radius: 999px;
  padding: 8px 12px;
  font-size: .92rem;
  font-weight: 900;
  box-shadow:
    inset 0 0 16px rgba(103,232,249,.12),
    0 6px 14px rgba(0,0,0,.36);
}

.archive-number {
  color: #94a3b8;
  font-size: .76rem;
  font-weight: 900;
  letter-spacing: .8px;
}

.viewport {
  height: 230px;
  border-radius: 26px;
  margin-bottom: 16px;
  border: 3px solid #0f172a;
  position: relative;
  overflow: hidden;
  background: #020617;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.06),
    inset 0 -45px 70px rgba(0,0,0,.38),
    0 12px 30px rgba(0,0,0,.42);
}

.viewport::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 8;
  pointer-events: none;
  background:
    linear-gradient(120deg, rgba(255,255,255,.24), transparent 20%, transparent 60%, rgba(255,255,255,.08)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 6px);
  mix-blend-mode: screen;
}

.viewport::after {
  content: "";
  position: absolute;
  inset: 12px;
  z-index: 9;
  pointer-events: none;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,.14);
}

.art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.thing {
  position: relative;
  z-index: 2;
  font-size: 1.35rem;
  line-height: 1.28;
  font-weight: 900;
  color: #f8fafc;
  margin-bottom: 14px;
  text-shadow: 0 2px 0 rgba(0,0,0,.36);
}

.era {
  position: relative;
  z-index: 2;
  display: inline-block;
  padding: 7px 11px;
  border-radius: 999px;
  background: rgba(103,232,249,.12);
  border: 1px solid rgba(103,232,249,.28);
  color: #a5f3fc;
  font-size: .82rem;
  font-weight: 900;
}

.hint {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 16px;
  z-index: 2;
  color: #94a3b8;
  font-size: .78rem;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  border-top: 1px solid rgba(255,255,255,.1);
  padding-top: 10px;
}

.screw {
  position: absolute;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 35%, #f8fafc, #64748b 55%, #1e293b);
  z-index: 4;
  box-shadow:
    inset -2px -2px 4px rgba(0,0,0,.45),
    0 0 8px rgba(255,255,255,.18);
}

.s1 { left: 16px; top: 16px; }
.s2 { right: 16px; top: 16px; }
.s3 { left: 16px; bottom: 16px; }
.s4 { right: 16px; bottom: 16px; }

.pin {
  position: absolute;
  left: 50%;
  bottom: -38px;
  transform: translateX(-50%);
  width: 24px;
  height: 24px;
  background: #67e8f9;
  border: 5px solid #020617;
  border-radius: 50%;
  box-shadow: 0 0 28px rgba(103,232,249,.95);
}

.pin::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 19px;
  width: 2px;
  height: 24px;
  background: rgba(103,232,249,.65);
  transform: translateX(-50%);
}

footer {
  background: #0f172a;
  color: #94a3b8;
  text-align: center;
  padding: 20px;
}

@media (max-width: 760px) {
  .machine-frame {
    padding: 14px;
  }

  .teleporter {
    margin: 18px 18px 24px;
  }

  .timeline-window {
    margin: 0 14px 24px;
  }

  .teleporter-row {
    grid-template-columns: 1fr;
  }

  .event {
    width: 292px;
    min-height: 530px;
  }

  .timeline-track {
    padding-left: 22px;
    padding-right: 22px;
  }

  .timeline-line {
    left: 22px;
    right: 22px;
  }

  .pipe,
  .gear,
  .gauge,
  .warning {
    display: none;
  }

  nav a {
    margin-left: 8px;
  }
}
</style>
</head>

<body>
<header>
  <div class="topbar">
    <div class="brand">ImKwadz</div>
    <nav>
      <a href="/home/">Home</a>
      <a href="/fun/">Fun</a>
      <a href="/about/">About</a>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>Time Machine</h1>
  <p>Scroll right through history, or use the teleporter to jump somewhere specific.</p>
</section>

<section class="machine-body">
  <div class="machine-frame">
    <div class="rivets">
      <span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="r4"></span>
      <span class="r5"></span><span class="r6"></span><span class="r7"></span><span class="r8"></span>
    </div>

    <div class="pipe top"></div>
    <div class="pipe bottom"></div>
    <div class="pipe left"></div>
    <div class="pipe right"></div>

    <div class="gear g1"></div>
    <div class="gear g2"></div>
    <div class="gear g3"></div>

    <div class="gauge a"></div>
    <div class="gauge b"></div>

    <div class="warning w1">TIME CORE ONLINE</div>
    <div class="warning w2">DO NOT ERASE HISTORY</div>

    <div class="teleporter">
      <p class="teleporter-title">TELEPORTER</p>

      <div class="teleporter-row">
        <input id="searchInput" placeholder="Try 2019, moon, Big Bang, 1776..." />
        <button id="jumpBtn">Teleport</button>
        <button id="leftBtn">←</button>
        <button id="rightBtn">→</button>
      </div>

      <div class="quick-jumps">

function renderTimeline() {
  timeline.innerHTML = events.map((event, index) => {
    const [year, thing] = event;
    const [artClass, era] = artFor(index, year, thing);

    return `
      <article class="event" id="event-${index}">
        <span class="screw s1"></span>
        <span class="screw s2"></span>
        <span class="screw s3"></span>
        <span class="screw s4"></span>

        <div class="card-top">
          <div class="year">${year}</div>
          <div class="archive-number">ARCHIVE ${String(index + 1).padStart(3, "0")}</div>
        </div>

        <div class="viewport">
          ${makeArt(artClass)}
        </div>

        <div class="thing">${thing}</div>
        <div class="era">${era}</div>

        <div class="hint">
          <span>TIME RECORD</span>
          <span>${index + 1}/${events.length}</span>
        </div>

        <div class="pin"></div>
      </article>
    `;
  }).join("");
}

function findEvent(query) {
  const q = clean(query);
  if (!q) return null;

  let exactYear = events.findIndex(e => clean(e[0]) === q);
  if (exactYear !== -1) return exactYear;

  let containsYear = events.findIndex(e => clean(e[0]).includes(q));
  if (containsYear !== -1) return containsYear;

  let containsText = events.findIndex(e => clean(e[1]).includes(q));
  if (containsText !== -1) return containsText;

  return null;
}

function jumpTo(query) {
  const index = findEvent(query);

  document.querySelectorAll(".event").forEach(e => e.classList.remove("highlight"));

  if (index === null) {
    message.textContent = "Teleporter failed. History refused.";
    return;
  }

  const target = document.getElementById(`event-${index}`);
  const targetLeft = target.offsetLeft - track.clientWidth / 2 + target.clientWidth / 2;

  track.scrollTo({
    left: targetLeft,
    behavior: "smooth"
  });

  target.classList.add("highlight");
  message.textContent = `Teleported to ${events[index][0]} — ${events[index][1]}`;
}

document.getElementById("jumpBtn").onclick = () => jumpTo(input.value);

document.getElementById("leftBtn").onclick = () => {
  track.scrollBy({ left: -700, behavior: "smooth" });
};

document.getElementById("rightBtn").onclick = () => {
  track.scrollBy({ left: 700, behavior: "smooth" });
};

input.addEventListener("keydown", e => {
  if (e.key === "Enter") jumpTo(input.value);
});

document.querySelectorAll("[data-jump]").forEach(btn => {
  btn.onclick = () => {
    input.value = btn.dataset.jump;
    jumpTo(btn.dataset.jump);
  };
});

track.addEventListener("wheel", e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    track.scrollLeft += e.deltaY;
  }
}, { passive:false });

renderTimeline();
